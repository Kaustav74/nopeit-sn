<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIR-1 SoloLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen">
  <main id="app" class="max-w-xl mx-auto px-4 py-6"></main>
  <script>
    let lessons=[]; let state={};
    const app=document.getElementById('app');
    async function boot(){ lessons=await (await fetch('lessons.json?v=2')).json(); home(); }
    function home(){
      app.innerHTML=`<p class="text-emerald-400 text-xs uppercase">New SoloLearn</p><h1 class="text-3xl font-bold mt-2">Every chapter. Concept first.</h1><p class="text-slate-400 text-sm mt-2">${lessons.length} concepts from the topics in your notes. The question opens only after the concept.</p><div class="grid gap-3 mt-6">${['Physics','Chemistry','Mathematics'].map(s=>`<button onclick="openSubject('${s}')" class="p-5 rounded-2xl bg-slate-900 border border-slate-700 text-left"><div class="text-amber-300 text-xs">${lessons.filter(l=>l.subject===s).length} concepts</div><div class="text-xl font-bold">${s}</div></button>`).join('')}</div>`;
    }
    function openSubject(subject){
      app.innerHTML=`<button onclick="home()" class="text-xs text-slate-400">Subjects</button><h2 class="text-2xl font-bold mt-2">${subject}</h2>${['Class 11','Class 12'].map(g=>`<h3 class="text-amber-400 mt-5">${g}</h3><div class="grid gap-2 mt-2">${lessons.filter(l=>l.subject===subject&&l.grade===g).map((l,i)=>`<button onclick="openChapter('${subject}','${g}','${l.chapter.replace(/'/g,"\\'")}','${l.title.replace(/'/g,"\\'")}')" class="p-4 rounded-xl bg-slate-950 border border-slate-800 text-left"><div class="text-white">${l.chapter}</div><div class="text-xs text-slate-400">${l.title}</div></button>`).join('')}</div>`).join('')}`;
    }
    function openChapter(subject,grade,chapter,title){
      state={subject,grade,chapter,title};
      const l=lessons.find(x=>x.subject===subject&&x.grade===grade&&x.chapter===chapter&&x.title===title);
      app.innerHTML=`<button onclick="openSubject('${subject}')" class="text-xs text-slate-400">Chapters</button><p class="text-emerald-400 text-xs font-bold uppercase mt-3">Concept · ${grade} ${subject}</p><h2 class="text-2xl font-bold mt-1">${chapter}</h2><p class="text-amber-300 text-sm">${title}</p><div class="p-5 mt-4 rounded-2xl bg-slate-950 border border-emerald-500/40 leading-7">${l.concept}</div><button onclick="ask()" class="w-full mt-4 p-4 rounded-2xl bg-emerald-500 text-slate-950 font-bold">I read the concept. Ask me.</button>`;
    }
    function ask(){
      const l=lessons.find(x=>x.subject===state.subject&&x.grade===state.grade&&x.chapter===state.chapter&&x.title===state.title);
      app.innerHTML=`<button onclick="openChapter('${l.subject}','${l.grade}','${l.chapter.replace(/'/g,"\\'")}','${l.title.replace(/'/g,"\\'")}')" class="text-xs text-slate-400">Back to concept</button><p class="text-amber-300 text-xs font-bold uppercase mt-3">Question</p><h2 class="text-xl font-bold mt-1">${l.chapter}</h2><p class="mt-4">${l.q}</p><div class="grid gap-2 mt-4">${l.options.map((o,i)=>`<button onclick="answer(${i})" class="p-4 rounded-2xl bg-slate-900 border border-slate-600 text-left">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;
    }
    function answer(choice){
      const l=lessons.find(x=>x.subject===state.subject&&x.grade===state.grade&&x.chapter===state.chapter&&x.title===state.title);
      if(choice===l.answer){
        app.innerHTML=`<p class="text-emerald-400 text-2xl font-bold">Correct</p><p class="mt-3">${l.easy}</p><button onclick="openSubject('${l.subject}')" class="w-full mt-4 p-4 rounded-2xl bg-emerald-500 text-slate-950 font-bold">Next chapter</button>`;
      } else {
        app.innerHTML=`<p class="text-rose-400 text-2xl font-bold">Not yet</p><p class="mt-3">${l.easy}</p><button onclick="openChapter('${l.subject}','${l.grade}','${l.chapter.replace(/'/g,"\\'")}','${l.title.replace(/'/g,"\\'")}')" class="w-full mt-4 p-4 rounded-2xl bg-amber-400 text-slate-950 font-bold">Read the concept again</button>`;
      }
    }
    boot();
  </script>
</body>
</html>
