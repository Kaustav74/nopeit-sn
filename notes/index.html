<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easy notes from your PDFs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen">
  <main class="max-w-2xl mx-auto px-4 py-8 space-y-5">
    <p class="text-emerald-400 text-xs uppercase tracking-widest">FreeLLMAPI</p>
    <h1 class="text-3xl font-bold">Upload notes and questions</h1>
    <p class="text-slate-400 text-sm">Upload the notes PDF and the questions PDF. The page reads them here and asks FreeLLMAPI for simpler notes.</p>
    <label class="block text-sm">Notes PDF
      <input id="notes" type="file" accept="application/pdf" class="mt-1 w-full text-sm">
    </label>
    <label class="block text-sm">Questions PDF
      <input id="questions" type="file" accept="application/pdf" class="mt-1 w-full text-sm">
    </label>
    <button id="go" class="w-full p-4 rounded-2xl bg-emerald-500 text-slate-950 font-bold">Make easy notes</button>
    <p id="status" class="text-sm text-slate-400"></p>
    <article id="out" class="hidden p-5 rounded-2xl bg-slate-950 border border-emerald-500/40 whitespace-pre-wrap leading-7"></article>
  </main>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const status = document.getElementById("status");
    const out = document.getElementById("out");
    async function pdfText(file, limit = 12) {
      const data = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({data}).promise;
      let text = "";
      const pages = Math.min(pdf.numPages, limit);
      for (let i = 1; i <= pages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      return text.slice(0, 12000);
    }
    document.getElementById("go").onclick = async () => {
      const base = "https://my-freellmapi-server.onrender.com/v1";
      const key = "freellmapi-aee0bcf8947be1ae92447fee0175f33e3277b275372f2931";
      const notes = document.getElementById("notes").files[0];
      const questions = document.getElementById("questions").files[0];
      if (!notes) { status.textContent = "Add a notes PDF."; return; }
      status.textContent = "Reading the PDFs...";
      out.classList.add("hidden");
      try {
        const notesText = await pdfText(notes);
        const qText = questions ? await pdfText(questions) : "";
        status.textContent = "Asking FreeLLMAPI...";
        const models = ["auto", "gemini-3.8-flash"];
        let data = null, res = null, last = "";
        for (const model of models) {
          res = await fetch(base + "/chat/completions", {
            method: "POST",
            headers: {"Authorization": "Bearer " + key, "Content-Type": "application/json"},
            body: JSON.stringify({
              model,
              messages: [
                {role: "system", content: "Turn student notes into short easy notes. Concept first. Then one check question with four options and the answer. Use the student's wording where it helps. Do not copy long copyrighted passages."},
                {role: "user", content: "NOTES:\n" + notesText + "\n\nQUESTIONS:\n" + qText}
              ]
            })
          });
          data = await res.json();
          if (res.ok && data.choices?.[0]?.message?.content) break;
          last = data.error?.message || JSON.stringify(data).slice(0, 200);
        }
        if (!res.ok) throw new Error(last);
        out.textContent = data.choices?.[0]?.message?.content || "No text came back.";
        out.classList.remove("hidden");
        status.textContent = "Done. The key was not saved on the server.";
      } catch (err) {
        status.textContent = "Could not finish: " + err.message + ". The FreeLLMAPI server must allow https://kaustav74.github.io. On Render, set DASHBOARD_ORIGINS=https://kaustav74.github.io and restart.";
      }
    };
  </script>
</body>
</html>
